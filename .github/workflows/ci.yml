name: CI Pipeline

on:
  push:
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Pytest & Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Backend Pytest suite
        run: |
          pytest Backend/tests

      - name: Verify GeoAI E2E Preflight logic
        run: |
          pytest Backend/tests/test_geoai_agent_e2e_preflight.py
          python scripts/preflight_geoai_agent_e2e.py --help

  frontend-ci:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Run Text-Encoding, API Contracts & TS Typecheck
        run: |
          npm --prefix frontend run lint

      - name: Run Frontend Unit Tests
        run: |
          npm --prefix frontend run test:unit

      - name: Build Frontend
        run: |
          npm --prefix frontend run build
